<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FMB Kitchen Management System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --primary:#c0392b; --primary-dark:#922b21; --accent:#27ae60; --bg:#f7f5f2;
  --card:#ffffff; --text:#2c2c2c; --border:#e0dcd5; --warn:#e67e22; --danger:#c0392b;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans Devanagari","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);}
.hidden{display:none !important;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;padding:8px;border:1px solid var(--border);border-radius:6px;width:100%;margin:4px 0 12px 0;font-size:14px;}
label{font-weight:600;font-size:13px;color:#555;}

/* Login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#c0392b,#e67e22);}
.login-box{background:var(--card);padding:36px;border-radius:14px;width:360px;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center;}
.login-box h1{font-size:20px;margin-bottom:4px;}
.lang-toggle-login{margin:8px 0 20px;}
.lang-btn{background:none;border:none;color:var(--primary);font-weight:600;text-decoration:underline;}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:8px;width:100%;font-size:15px;font-weight:600;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-secondary{background:#eee;color:#333;border:none;padding:10px 16px;border-radius:8px;margin-left:8px;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-small{background:#eee;border:none;padding:6px 10px;border-radius:6px;font-size:13px;margin-left:6px;}
.error-text{color:var(--danger);font-size:13px;}
.hint{font-size:11px;color:#999;margin-top:16px;}

/* App shell */
.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;position:sticky;top:0;z-index:10;}
.topbar-left{display:flex;align-items:center;gap:10px;}
.brand{font-weight:700;font-size:17px;}
.hamburger{background:none;border:none;color:#fff;font-size:22px;display:none;}
.topbar-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.user-info{font-size:13px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:12px;}
.lang-btn{color:#fff;background:rgba(255,255,255,.15);border:none;padding:5px 8px;border-radius:6px;font-size:12px;}

.body-wrap{display:flex;flex:1;}
.sidebar{width:230px;background:#2c2c2c;color:#eee;min-height:100%;padding:10px 0;}
.sidebar ul{list-style:none;margin:0;padding:0;}
.sidebar li{padding:12px 20px;cursor:pointer;font-size:14px;border-left:4px solid transparent;}
.sidebar li:hover{background:#3a3a3a;}
.sidebar li.active{background:#3a3a3a;border-left-color:var(--accent);font-weight:600;}
.main-content{flex:1;padding:20px;max-width:1100px;}

/* Cards / tables */
.card{background:var(--card);border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
.kpi-card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-top:4px solid var(--primary);}
.kpi-card .kpi-value{font-size:26px;font-weight:700;color:var(--primary-dark);}
.kpi-card .kpi-label{font-size:12px;color:#777;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;}
th{background:#f0ede8;font-size:12px;text-transform:uppercase;color:#666;}
tr:hover{background:#fafafa;}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
.tag-veg{background:#eafaf1;color:#1e8449;border:1px solid #1e8449;}
.tag-nonveg{background:#fdedec;color:#a93226;border:1px solid #a93226;}
.tag-pending{background:#fef5e7;color:#b9770e;}
.tag-approved{background:#eafaf1;color:#1e8449;}
.tag-rejected{background:#fdedec;color:#a93226;}
.tag-partial{background:#eaf2fb;color:#2e5f9e;}
.tag-received,.tag-full{background:#eafaf1;color:#1e8449;}

.form-row{display:flex;gap:12px;flex-wrap:wrap;}
.form-row > div{flex:1;min-width:160px;}
.section-title{font-size:16px;font-weight:700;margin-bottom:10px;color:var(--primary-dark);}
.small-btn{padding:4px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:#fff;}
.add-row-btn{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:13px;}
.remove-row-btn{background:var(--danger);color:#fff;border:none;padding:4px 8px;border-radius:6px;font-size:12px;}
.shortfall{color:var(--danger);font-weight:700;}
.ok-stock{color:var(--accent);font-weight:700;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal-box{background:#fff;padding:24px;border-radius:12px;width:360px;max-width:90vw;}

.toast{position:fixed;bottom:20px;right:20px;background:#333;color:#fff;padding:12px 18px;border-radius:8px;z-index:200;font-size:14px;}
.toast.error{background:var(--danger);}
.toast.success{background:var(--accent);}

@media(max-width:768px){
  .hamburger{display:block;}
  .sidebar{position:fixed;left:-230px;top:52px;bottom:0;transition:left .2s;z-index:50;}
  .sidebar.open{left:0;}
  .main-content{padding:12px;}
}

</style>
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">

    <p class="lang-toggle-login">
      <button onclick="setLang('hi')" class="lang-btn" id="langHiBtn">हिंदी</button> |
      <button onclick="setLang('en')" class="lang-btn" id="langEnBtn">English</button>

    <form id="loginForm">
      <label data-i18n="email">Email</label>
      <input type="email" id="loginEmail" required autocomplete="username">
      <label data-i18n="password">Password / पासवर्ड</label>

      <button type="submit" class="btn-primary" data-i18n="loginBtn">Login / लॉगिन करें</button>

    <p><a href="#" onclick="showForgotPassword()" data-i18n="forgotPassword">Forgot Password? / पासवर्ड भूल गए?</a></p>

    <p class="hint" data-i18n="firstTimeHint">First time setup? See README.md to create the first Admin user.</p>

</div>

<!-- ===================== FORGOT PASSWORD MODAL ===================== -->
<div id="forgotModal" class="modal hidden">
  <div class="modal-box">
    <h3 data-i18n="resetPasswordTitle">Reset Password / पासवर्ड रीसेट करें</h3>
    <input type="email" id="resetEmail" placeholder="Email" data-i18n-placeholder="email">
    <button class="btn-primary" onclick="sendResetEmail()" data-i18n="sendResetLink">Send Reset Link / लिंक भेजें</button>
    <button class="btn-secondary" onclick="closeModal('forgotModal')" data-i18n="cancel">Cancel / रद्द करें</button>
    <p id="resetMsg"></p>
  </div>
</div>

<!-- ===================== MAIN APP (after login) ===================== -->
<div id="appShell" class="app-shell hidden">
  <header class="topbar">
    <div class="topbar-left">
      <button id="hamburgerBtn" class="hamburger" onclick="toggleSidebar()">☰</button>
      <span class="brand">🍲 FMB Kitchen</span>
    </div>
    <div class="topbar-right">
      <span id="userInfo" class="user-info"></span>
      <button onclick="setLang('hi')" class="lang-btn">हिंदी</button>
      <button onclick="setLang('en')" class="lang-btn">EN</button>
      <button class="btn-small" onclick="showChangePassword()" data-i18n="changePassword">Change Password</button>
      <button class="btn-small btn-danger" onclick="logout()" data-i18n="logout">Logout</button>
    </div>
  </header>

  <div class="body-wrap">
    <nav id="sidebar" class="sidebar">
      <ul id="navList"><!-- populated by JS based on permissions --></ul>
    </nav>

    <main id="mainContent" class="main-content">
      <!-- module content injected here by JS -->
    </main>
  </div>
</div>

<!-- ===================== CHANGE PASSWORD MODAL ===================== -->
<div id="changePwModal" class="modal hidden">
  <div class="modal-box">
    <h3 data-i18n="changePassword">Change Password / पासवर्ड बदलें</h3>
    <label data-i18n="newPassword">New Password / नया पासवर्ड</label>
    <input type="password" id="newPassword">

    <button class="btn-secondary" onclick="closeModal('changePwModal')" data-i18n="cancel">Cancel / रद्द करें</button>
    <p id="changePwMsg"></p>
  </div>
</div>

// ---------------- db.js: Firestore helpers ----------------
// ==========================================================================
// db.js — Generic Firestore helper functions used by every module.
// Har module in generic functions ka use karke Firestore se data
// padhta/likhta hai — is se code chhota aur maintain karne mein aasaan rehta hai.
// ==========================================================================
// ---- generic helpers -----------------------------------------------------
async function listAll(col){
  const snap = await getDocs(collection(db, col));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function getOne(col, id){
  const s = await getDoc(doc(db, col, id));
  return s.exists() ? { id: s.id, ...s.data() } : null;
}

async function addOne(col, data){
  const ref = await addDoc(collection(db, col), { ...data, createdAt: serverTimestamp() });
  return ref.id;
}

async function setOne(col, id, data){
  await setDoc(doc(db, col, id), data);
  return id;
}

async function updateOne(col, id, data){
  await updateDoc(doc(db, col, id), data);
}

async function removeOne(col, id){
  await deleteDoc(doc(db, col, id));
}

async function listWhere(col, field, op, value){
  const q = query(collection(db, col), where(field, op, value));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}
// ---- Stock helpers ---------------------------------------------------------
// stock collection: doc id == ingredientId, fields { qtyInHand, qtyInPipeline }

async function getStockMap(){
  const rows = await listAll("stock");
  const map = {};
  rows.forEach(r => map[r.id] = r);
  return map;
}

async function adjustStock(ingredientId, deltaInHand = 0, deltaPipeline = 0){
  const ref = doc(db, "stock", ingredientId);
  await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);
    const cur = snap.exists() ? snap.data() : { qtyInHand: 0, qtyInPipeline: 0 };
    const next = {
      qtyInHand: Math.round(((cur.qtyInHand||0) + deltaInHand) * 1000) / 1000,
      qtyInPipeline: Math.round(((cur.qtyInPipeline||0) + deltaPipeline) * 1000) / 1000
    };
    tx.set(ref, next, { merge: true });
  });
}

async function addLedgerEntry(entry){
  await addOne("stockLedger", { ...entry, date: entry.date || todayStr() });
}

// ---- Rate helper: Per-thali/Per-person costing MUST be based on the actual
// Receiving/Purchase tab rate (not the old Ingredient Master rate field).
// We take the MOST RECENT receiving rate recorded for each ingredient.
async function getReceivingRateMap(){
  const receivings = await listAll("receivings");
  receivings.sort((a,b)=> (a.date||"").localeCompare(b.date||"")); // oldest -> newest
  const map = {};
  receivings.forEach(r=>{
    (r.items||[]).forEach(it=>{
      if (it.ingredientId && it.rate){ map[it.ingredientId] = Number(it.rate)||0; } // later overwrites earlier => latest wins
    });
  });
  return map;
}

// Compute total cost / per-thali / per-person for one menu doc using a rate map.
// Items without ingredientId (custom/open-field items) are skipped from cost
// (their rate is unknown) but still counted for indent/requirement purposes elsewhere.
function computeMenuCost(menu, rateMap){
  const numThalis = Number(menu.numThalis)||0;
  const numPersons = Number(menu.numPersons)||0;
  let cost = 0;
  (menu.items||[]).forEach(it=>{
    if (!it.ingredientId) return; // custom item, rate unknown, excluded from cost
    const rate = rateMap[it.ingredientId] || 0;
    cost += (Number(it.requiredQty)||0) * rate;
  });
  return {
    cost,
    perThali: numThalis ? cost/numThalis : 0,
    perPerson: numPersons ? cost/numPersons : 0
  };
}

// ---------------- permissions.js: Roles & permissions ----------------
// ==========================================================================
// permissions.js — Roles, default permission matrix, and access checks.
//
// Har module ke liye 6 action types: view, add, edit, approve, issue, export
// Admin har Custom Role ke liye in 6 actions ko alag-alag ON/OFF kar sakta hai.
// ==========================================================================

const MODULES = [
  "dashboard","ingredients","suppliers","menu","indent","approval",
  "storeIssue","receiving","procurement","distribution","reports","perPersonExp","users"
];
const ACTIONS = ["view","add","edit","approve","issue","delete","export"];

// Built-in default roles (Admin can still override per-user with custom roles)
const DEFAULT_ROLE_PERMISSIONS = {
  admin: allTrueForAllModules(),
  cook: {
    dashboard:{view:true},
    menu:{view:true,add:true,edit:true},          // only if admin grants "canCreateMenu" flag on user
    indent:{view:true},
  },
  storekeeper: {
    dashboard:{view:true},
    approval:{view:true},
    storeIssue:{view:true,issue:true,edit:true},
    receiving:{view:true,add:true},
    reports:{view:true},
  },
  procurement: {
    dashboard:{view:true},
    indent:{view:true},
    procurement:{view:true,add:true,edit:true},
    suppliers:{view:true,add:true,edit:true},
    reports:{view:true,export:true},
  },
  distribution: {
    dashboard:{view:true},
    distribution:{view:true,add:true,edit:true},
    reports:{view:true},
  }
};

function allTrueForAllModules(){
  const p = {};
  MODULES.forEach(m=>{ p[m] = {}; ACTIONS.forEach(a=> p[m][a] = true); });
  return p;
}

/**
 * Resolve the effective permission object for a user.
 * user.permissions (custom, stored in Firestore users/{uid}) always wins;
 * otherwise fall back to DEFAULT_ROLE_PERMISSIONS[user.role].
 */
function resolvePermissions(user){
  if (!user) return {};
  if (user.permissions && Object.keys(user.permissions).length){
    return user.permissions;
  }
  return DEFAULT_ROLE_PERMISSIONS[user.role] || {};
}

function can(user, module, action){
  if (!user) return false;
  if (user.role === "admin") return true;
  const perms = resolvePermissions(user);
  return !!(perms[module] && perms[module][action]);
}

onAuthStateChanged(auth, async (user)=>{
  currentUser = user;
  if (user){
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()){
      currentUserDoc = { uid:user.uid, email:user.email, ...snap.data() };
    } else {
      // User exists in Firebase Auth but has no profile doc yet.
      // This happens right after Admin creates them in Firebase Console manually
      // before adding their Firestore profile — block access and explain.
      currentUserDoc = { uid:user.uid, email:user.email, role:"none", permissions:{} };
      showToast("यूज़र प्रोफाइल नहीं मिली। Admin से संपर्क करें। / User profile not found. Contact Admin.", "error");
    }
    window.currentUserDoc = currentUserDoc;
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appShell").classList.remove("hidden");
    document.getElementById("userInfo").textContent =
      `${currentUserDoc.name || user.email} (${currentUserDoc.role || "?"})`;
    if (window.initAppUI) window.initAppUI();
  } else {
    currentUserDoc = null;
    window.currentUserDoc = null;
    document.getElementById("appShell").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");
  }
});

function csvExport(filename, rows){
  const csv = rows.map(r => r.map(c => `"${String(c===undefined?"":c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

async function renderDashboard(){
  main().innerHTML = `<p>Loading...</p>`;
  const today = todayStr();
  const [menus, distribution, rateMap] = await Promise.all([
    listWhere("menus","date","==",today),
    listWhere("distribution","date","==",today),
    getReceivingRateMap()
  ]);
  const thalisToPrepare = menus.reduce((s,m)=> s + (Number(m.numThalis)||0), 0);
  const personsToServe = menus.reduce((s,m)=> s + (Number(m.numPersons)||0), 0);
  const distToday = distribution[0] || {distributedThalis:0, preparedThalis:0};

  // Per-thali / per-person expenditure: computed from Menu items using the
  // MOST RECENT Receiving/Purchase tab rate for each ingredient (not the
  // old Ingredient Master rate field).
  let expenditureToday = 0;
  menus.forEach(m => { expenditureToday += computeMenuCost(m, rateMap).cost; });
  const perThali = thalisToPrepare ? (expenditureToday / thalisToPrepare) : 0;
  const perPerson = personsToServe ? (expenditureToday / personsToServe) : 0;

  main().innerHTML = `
    <div class="section-title">${t("dashboard")} — ${today}</div>
    <div class="kpi-grid">
      ${kpiCard(thalisToPrepare, "thalisToPrepare")}
      ${kpiCard(personsToServe, "personsToServe")}
      ${kpiCard(distToday.distributedThalis||0, "thalisDistributed")}
      ${kpiCard(money(expenditureToday.toFixed(2)), "todaysExpenditure")}
      ${kpiCard(money(perThali.toFixed(2)), "perThaliExpenditure")}
      ${kpiCard(money(perPerson.toFixed(2)), "perPersonExpenditure")}
    </div>
    <div class="card">
      <div class="section-title">${t("todaysMenu")}</div>
      ${menus.length ? `<table><tr><th>${t("menuName")}</th><th>${t("numThalis")}</th><th>${t("numPersons")}</th></tr>
        ${menus.map(m=>`<tr><td>${esc(currentLang==="hi"?m.name_hi:m.name_en)}</td><td>${esc(m.numThalis)}</td><td>${esc(m.numPersons||"-")}</td></tr>`).join("")}
      </table>` : `<p>${t("noData")}</p>`}
    </div>`;
}

// ---- Bulk upload parser: matches the FMB items list format
// (Sr No | Hindi Name | English Name), with category-header rows and an
// automatic Veg -> Non-Veg switch once a "2. ..." section header is seen.
window.bulkUploadIngredients = async function(){
  const fileInput = document.getElementById("bulkIngFile");
  const msgEl = document.getElementById("bulkUploadMsg");
  const defaultUnit = document.getElementById("bulkIngDefaultUnit").value || "kg";
  const file = fileInput.files[0];
  if (!file){ msgEl.textContent = currentLang==='hi' ? "पहले फाइल चुनें" : "Choose a file first"; return; }
  msgEl.textContent = t("uploading");
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });

    const existing = await listAll("ingredients");
    const existingNames = new Set(existing.map(i => (i.name_hi||"").trim().toLowerCase()).filter(Boolean));

    let currentCategory = "";
    let isNonVeg = false;
    let imported = 0, skipped = 0;

    for (let r = 0; r < rows.length; r++){
      const row = rows[r];
      const c0 = String(row[0]||"").trim();
      const c1 = String(row[1]||"").trim();
      const c2 = String(row[2]||"").trim();
      if (!c0 && !c1 && !c2) continue; // blank line
      if (/^क्र\.?$/i.test(c0) || /^sr/i.test(c0)) continue; // header row itself

      const looksLikeCategoryHeader = (c0 && !c1 && !c2) || (isNaN(Number(c0)) && c0.length>3 && !c1 && !c2);
      if (looksLikeCategoryHeader){
        currentCategory = c0.replace(/^[A-Za-z0-9]+\.\s*/, "").trim(); // strip "A. " / "2. " prefix
        if (/^2\./.test(c0)) isNonVeg = true; // "2. मांसाहारी..." section => everything after is Non-Veg
        continue;
      }
      // item row: needs at least a Hindi or English name
      const nameHi = c1, nameEn = c2;
      if (!nameHi && !nameEn) continue;
      const key = nameHi.trim().toLowerCase();
      if (key && existingNames.has(key)){ skipped++; continue; }
      const data = {
        name_hi: nameHi, name_en: nameEn, unit: defaultUnit,
        type: isNonVeg ? "nonveg" : "veg", category: currentCategory
      };
      const id = await addOne("ingredients", data);
      await setOne("stock", id, { qtyInHand:0, qtyInPipeline:0 });
      if (key) existingNames.add(key);
      imported++;
    }
    msgEl.textContent = `${imported} ${t("itemsImported")}, ${skipped} ${t("itemsSkipped")}`;
    showToast(t("saved"),"success");
    renderIngredients();
  }catch(err){
    console.error(err);
    msgEl.textContent = err.message;
  }
};

// Combines category filter + text search to repopulate the ingredient <select>
window.filterMenuIngOptions = function(){
  const sel = document.getElementById("menuIngSelect");
  if (!sel) return;
  const cat = document.getElementById("menuCatFilter")?.value || "";
  const q = (document.getElementById("menuIngSearch")?.value || "").trim().toLowerCase();
  const list = (window.__ingredientsCache||[]).filter(i=>{
    if (cat && i.category !== cat) return false;
    if (q && !((i.name_hi||"").toLowerCase().includes(q) || (i.name_en||"").toLowerCase().includes(q))) return false;
    return true;
  });
  sel.innerHTML = list.map(i=>`<option value="${i.id}">${ingName(i)} (${esc(i.unit)}) — ${t(i.type)}</option>`).join("");
};

function renderMenuItemsTable(){
  const tbl = document.getElementById("menuItemsTable");
  if (!tbl) return;
  tbl.innerHTML = `<tr>
    <th>${t("ingredients")}</th><th>${t("requiredQty")}</th>
    <th>${t("availableStock")}</th><th>${t("shortfall")}</th><th></th></tr>` +
    menuDraftItems.map((row,idx)=>{
      if (!row.ingredientId){
        // custom/open-field item — not linked to Ingredient Master, no stock tracking
        return `<tr>
          <td>${esc(row.customName)} <span class="hint">(${t("customIngredient")})</span></td>
          <td>${row.requiredQty}</td><td>${t("notAvailable")}</td><td>-</td>
          <td><button class="remove-row-btn" onclick="removeMenuIngredient(${idx})">✕</button></td>
        </tr>`;
      }
      const ing = window.__ingredientsCache.find(i=>i.id===row.ingredientId);
      const avail = (window.__stockCache[row.ingredientId]?.qtyInHand) || 0;
      const shortfall = Math.max(0, row.requiredQty - avail);
      row.availableQty = avail; row.shortfallQty = shortfall;
      return `<tr>
        <td>${ing?ingName(ing):"?"}</td><td>${row.requiredQty}</td><td>${avail.toFixed(3)}</td>
        <td class="${shortfall>0?'shortfall':'ok-stock'}">${shortfall.toFixed(3)}</td>
        <td><button class="remove-row-btn" onclick="removeMenuIngredient(${idx})">✕</button></td>
      </tr>`;
    }).join("");
}
window.addMenuIngredient = function(){
  const ingredientId = document.getElementById("menuIngSelect").value;
  const requiredQty = Number(document.getElementById("menuIngQty").value)||0;
  if (!ingredientId || requiredQty<=0) return;
  menuDraftItems.push({ ingredientId, requiredQty });
  renderMenuItemsTable();
};
window.addMenuCustomIngredient = function(){
  const customName = document.getElementById("menuCustomIngName").value.trim();
  const requiredQty = Number(document.getElementById("menuCustomQty").value)||0;
  if (!customName || requiredQty<=0) return;
  menuDraftItems.push({ customName, requiredQty }); // no ingredientId => custom/open-field item
  document.getElementById("menuCustomIngName").value = "";
  renderMenuItemsTable();
};
window.removeMenuIngredient = function(idx){
  menuDraftItems.splice(idx,1);
  renderMenuItemsTable();
};
window.saveMenu = async function(){
  if (!menuDraftItems.length){ showToast("Kam se kam ek ingredient jodein","error"); return; }
  const data = {
    date: document.getElementById("menuDate").value || todayStr(),
    name_hi: document.getElementById("menuNameHi").value.trim(),
    name_en: document.getElementById("menuNameEn").value.trim(),
    numThalis: Number(document.getElementById("menuThalis").value)||0,
    numPersons: Number(document.getElementById("menuPersons").value)||0,
    items: menuDraftItems.map(r=> r.ingredientId
      ? { ingredientId:r.ingredientId, requiredQty:r.requiredQty }
      : { customName:r.customName, requiredQty:r.requiredQty })
  };
  const menuId = await addOne("menus", data);

  // Cook's menu automatically becomes a pending Indent for Admin to review/approve.
  // Admin can increase/decrease each item's quantity on the Approval screen —
  // Store Issue only becomes possible once Admin approves it.
  const stock = await getStockMap();
  const indentItems = data.items.map(it=> buildIndentItemFromMenuItem(it, stock));
  await addOne("indents", {
    date: data.date, menuId, createdBy: currentUserDoc.uid,
    createdByName: currentUserDoc.name || currentUserDoc.email,
    items: indentItems, status:"pending"
  });

  showToast(t("saved"),"success");
  renderMenu();
};
function buildIndentItemFromMenuItem(it, stock){
  const required = it.requiredQty;
  if (!it.ingredientId){
    // custom item — not in Ingredient Master, no stock to check against
    return { customName: it.customName, requiredQty: required, availableQty:0, shortfallQty: required, source: "custom" };
  }
  const available = stock[it.ingredientId]?.qtyInHand || 0;
  return {
    ingredientId: it.ingredientId, requiredQty: required,
    availableQty: available, shortfallQty: Math.max(0, required-available),
    source: "menu"
  };
}

          return `<tr><td>${ing?ingName(ing):esc(it.customName||"?")}</td>
            <td>${canApprove
              ? `<input type="number" step="0.001" style="width:100px;margin:0" id="apprQty_${ind.id}_${idx}" value="${it.requiredQty}" data-avail="${avail}" oninput="recalcApprovalShortfall('${ind.id}',${idx})">`
              : it.requiredQty}</td>
            <td>${avail.toFixed(3)}</td>
            <td id="apprShortfall_${ind.id}_${idx}" class="${it.shortfallQty>0?'shortfall':'ok-stock'}">${(it.shortfallQty||0).toFixed(3)}</td></tr>`;
        }).join("")}
        </table>
        ${canApprove?`<button class="btn-primary" style="width:auto" onclick="decideIndent('${ind.id}','approved')">${t("approve")}</button>
        <button class="btn-secondary" onclick="decideIndent('${ind.id}','rejected')">${t("reject")}</button>`:""}
      </div>`).join("")}`;
  window.__approvalIndentsCache = indents;
}
window.recalcApprovalShortfall = function(indId, idx){
  const input = document.getElementById(`apprQty_${indId}_${idx}`);
  const cell = document.getElementById(`apprShortfall_${indId}_${idx}`);
  const qty = Number(input.value)||0;
  const avail = Number(input.dataset.avail)||0;
  const shortfall = Math.max(0, qty-avail);
  cell.textContent = shortfall.toFixed(3);
  cell.className = shortfall>0 ? "shortfall" : "ok-stock";
};
window.decideIndent = async function(id, status){
  const ind = (window.__approvalIndentsCache||[]).find(i=>i.id===id);
  if (ind){
    // Pick up any quantity edits the Admin made before approving/rejecting.
    ind.items.forEach((it,idx)=>{
      const input = document.getElementById(`apprQty_${id}_${idx}`);
      if (input){
        const newQty = Number(input.value)||0;
        it.requiredQty = newQty;
        it.shortfallQty = Math.max(0, newQty - (it.availableQty||0));
      }
    });
    await updateOne("indents", id, { items: ind.items, status, approvedBy: currentUserDoc.uid, approvedAt: todayStr() });
  } else {
    await updateOne("indents", id, { status, approvedBy: currentUserDoc.uid, approvedAt: todayStr() });
  }
  showToast(t("saved"),"success");
  renderApproval();
};

async function renderStoreIssue(){
  const [indents, ingredients] = await Promise.all([listWhere("indents","status","==","approved"), listAll("ingredients")]);
  const canIssue = can(currentUserDoc, "storeIssue", "issue");
  const pending = indents.filter(i => !i.issueStatus || i.issueStatus==="pending" || i.issueStatus==="partial");
  main().innerHTML = `

      <div class="card" id="issueCard_${ind.id}">

        <table><tr><th>${t("ingredients")}</th><th>${t("requiredQty")}</th><th>${t("availableStock")}</th><th>${t("issueQty")}</th></tr>
        ${(ind.items||[]).map((it,idx)=>{
          const ing = it.ingredientId ? ingredients.find(i=>i.id===it.ingredientId) : null;
          const already = it.issuedQty || 0;
          return `<tr><td>${ing?ingName(ing):esc(it.customName||"?")}</td><td>${it.requiredQty}</td><td>${(it.availableQty||0).toFixed(3)}</td>
            <td><input type="number" step="0.001" id="issueQty_${ind.id}_${idx}" value="${already || Math.min(it.requiredQty, it.availableQty||0)}" ${canIssue?"":"disabled"}></td></tr>`;
        }).join("")}
        </table>
        ${canIssue?`<button class="btn-primary" style="width:auto" onclick="submitStoreIssue('${ind.id}')">${t("submitIssue")}</button>`:""}
      </div>`).join("")}`;
}
window.submitStoreIssue = async function(indentId){
  const ind = await getOne("indents", indentId);
  let allFull = true;
  for (let idx=0; idx<ind.items.length; idx++){
    const el = document.getElementById(`issueQty_${indentId}_${idx}`);
    const issuedQty = Number(el.value)||0;
    ind.items[idx].issuedQty = issuedQty;
    if (issuedQty < ind.items[idx].requiredQty) allFull = false;
    if (!ind.items[idx].ingredientId) continue; // custom item — no stock/ledger to adjust
    await adjustStock(ind.items[idx].ingredientId, -issuedQty, 0);
    await addLedgerEntry({ ingredientId: ind.items[idx].ingredientId, type:"out", qty:issuedQty,
      refType:"indent", refId: indentId });
  }
  await updateOne("indents", indentId, { items: ind.items, issueStatus: allFull? "full":"partial" });
  showToast(t("saved"),"success");
  renderStoreIssue();
};

          ${pos.map(p=>`<option value="${p.id}">${p.id.slice(0,6)} — ${esc(p.supplierName||"")}</option>`).join("")}

    ${receivings.map(r=>{
      const total = (r.items||[]).reduce((s,it)=>s+it.qty*it.rate,0);

function renderRecvItemsTable(){
  const tbl = document.getElementById("recvItemsTable");
  if (!tbl) return;
  tbl.innerHTML = `<tr><th>${t("ingredients")}</th><th>${t("requiredQty")}</th><th>${t("rate")}</th><th>${t("amount")}</th><th></th></tr>` +
    window.__recvDraftItems.map((row,idx)=>{
      const ing = window.__ingredientsCache.find(i=>i.id===row.ingredientId);
      return `<tr><td>${ing?ingName(ing):"?"}</td><td>${row.qty}</td><td>${money(row.rate)}</td>
        <td>${money(row.qty*row.rate)}</td>
        <td><button class="remove-row-btn" onclick="removeRecvItem(${idx})">✕</button></td></tr>`;
    }).join("");

window.addReceivingItem = function(){
  const ingredientId = document.getElementById("recvIngSelect").value;
  const qty = Number(document.getElementById("recvQty").value)||0;
  const rate = Number(document.getElementById("recvRate").value)||0;
  if (!ingredientId||qty<=0) return;
  window.__recvDraftItems.push({ ingredientId, qty, rate });
  renderRecvItemsTable();
};
window.removeRecvItem = function(idx){ window.__recvDraftItems.splice(idx,1); renderRecvItemsTable(); };
window.saveReceiving = async function(){
  const items = window.__recvDraftItems;
  if (!items.length) return;
  const poId = document.getElementById("recvPO").value || null;
  const supplierName = document.getElementById("recvSupplierName").value.trim();
  const date = document.getElementById("recvDate").value || todayStr();
  await addOne("receivings", { poId, supplierName, date, items });
  for (const it of items){
    await adjustStock(it.ingredientId, it.qty, poId ? -it.qty : 0); // moves qty from pipeline->hand if linked to PO
    await addLedgerEntry({ ingredientId: it.ingredientId, type:"in", qty: it.qty,
      amount: it.qty*it.rate, refType:"receiving", refId: poId||"manual", date });
  }
  showToast(t("saved"),"success");
  renderReceiving();
};

      <div class="section-title">${t("stockLedger")}</div>

        const ing = ingredients.find(i=>i.id===l.ingredientId);
        return `<tr><td>${esc(l.date)}</td><td>${ing?ingName(ing):"?"}</td><td>${esc(l.type)}</td><td>${esc(l.qty)}</td><td>${money(l.amount||0)}</td></tr>`;

window.exportMenuCostsCSV = function(){

  csvExport("menu_wise_expenditure.csv", rows);
};

// ==========================================================================
// PER PERSON EXPENDITURE — dedicated report, date-range filterable
// Rate basis: most recent Receiving/Purchase tab rate per ingredient.
// ==========================================================================
async function renderPerPersonExpenditure(){
  const fromEl = document.getElementById("ppeFrom");
  const toEl = document.getElementById("ppeTo");
  const fromDate = fromEl ? fromEl.value : "";
  const toDate = toEl ? toEl.value : "";

  const [menus, rateMap] = await Promise.all([listAll("menus"), getReceivingRateMap()]);
  let rows = menus.map(m=>({ ...m, ...computeMenuCost(m, rateMap) }));
  if (fromDate) rows = rows.filter(r => (r.date||"") >= fromDate);
  if (toDate) rows = rows.filter(r => (r.date||"") <= toDate);
  rows.sort((a,b)=> (b.date||"").localeCompare(a.date||""));

  const totalCost = rows.reduce((s,r)=>s+r.cost,0);
  const totalPersons = rows.reduce((s,r)=>s+(Number(r.numPersons)||0),0);
  const totalThalis = rows.reduce((s,r)=>s+(Number(r.numThalis)||0),0);
  const overallPerPerson = totalPersons ? totalCost/totalPersons : 0;
  const overallPerThali = totalThalis ? totalCost/totalThalis : 0;

  main().innerHTML = `
    <div class="section-title">${t("perPersonExp")}</div>
    <div class="card">
      <div class="form-row">
        <div><label>${currentLang==='hi'?'दिनांक से':'From Date'}</label><input type="date" id="ppeFrom" value="${esc(fromDate)}" onchange="renderPerPersonExpenditure()"></div>
        <div><label>${currentLang==='hi'?'दिनांक तक':'To Date'}</label><input type="date" id="ppeTo" value="${esc(toDate)}" onchange="renderPerPersonExpenditure()"></div>
      </div>
    </div>
    <div class="kpi-grid">
      ${kpiCard(money(totalCost.toFixed(2)), "todaysExpenditure")}
      ${kpiCard(money(overallPerThali.toFixed(2)), "perThaliExpenditure")}
      ${kpiCard(money(overallPerPerson.toFixed(2)), "perPersonExpenditure")}
    </div>
    <div class="card">
      <button class="small-btn" onclick="exportPerPersonCSV()">${t("exportExcel")}</button>
      <table><tr><th>${t("date")}</th><th>${t("menuName")}</th><th>${t("numThalis")}</th><th>${t("numPersons")}</th>
        <th>${t("total")}</th><th>${t("perThaliExpenditure")}</th><th>${t("perPersonExpenditure")}</th></tr>
      ${rows.length ? rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(currentLang==="hi"?r.name_hi:r.name_en)}</td>
        <td>${esc(r.numThalis)}</td><td>${esc(r.numPersons||"-")}</td><td>${money(r.cost)}</td>
        <td>${money(r.perThali.toFixed(2))}</td><td>${money(r.perPerson.toFixed(2))}</td></tr>`).join("") : `<tr><td colspan="7">${t("noData")}</td></tr>`}
      </table>
    </div>`;
  window.__ppeRowsForExport = rows;
}
window.exportPerPersonCSV = function(){
  const rows = [["Date","Menu","Thalis","Persons","Total Cost","Per Thali Cost","Per Person Cost"]];
  (window.__ppeRowsForExport||[]).forEach(r=> rows.push([r.date, r.name_en||r.name_hi, r.numThalis, r.numPersons||"", r.cost.toFixed(2), r.perThali.toFixed(2), r.perPerson.toFixed(2)]));
  csvExport("per_person_expenditure.csv", rows);
};

// ==========================================================================
// USERS (Admin only) — create user via secondary Firebase app instance
// so the currently logged-in Admin session is NOT replaced.
// Admin can assign a starting Role AND then fully customize permissions
// per module/action — custom permissions always override the role default.
// ==========================================================================
function permMatrixHtml(idPrefix, existingPerms){
  const p = existingPerms || {};
  return `<table><tr><th>${t("module")}</th>${ACTIONS.map(a=>`<th>${t(a)||a}</th>`).join("")}</tr>
    ${MODULES.map(m=>`<tr><td>${t(m)}</td>${ACTIONS.map(a=>
      `<td style="text-align:center"><input type="checkbox" id="${idPrefix}_${m}_${a}" ${p[m]&&p[m][a]?"checked":""}></td>`
    ).join("")}</tr>`).join("")}
  </table>`;
}
function readPermMatrix(idPrefix){
  const perms = {};
  MODULES.forEach(m=>{
    ACTIONS.forEach(a=>{
      const el = document.getElementById(`${idPrefix}_${m}_${a}`);
      if (el && el.checked){ perms[m] = perms[m]||{}; perms[m][a] = true; }
    });
  });
  return perms;
}
async function renderUsers(){
  const users = await listAll("users");
  main().innerHTML = `
    <div class="section-title">${t("users")}</div>
    <div class="card">
      <div class="form-row">
        <div><label>${t("name")}</label><input id="newUserName"></div>
        <div><label>${t("email")}</label><input id="newUserEmail" type="email"></div>
        <div><label>Temp ${t("password")}</label><input id="newUserPassword" value="Kitchen@123"></div>
        <div><label>${t("role")}</label>
          <select id="newUserRole" onchange="prefillNewUserPerms()">
            <option value="admin">Admin</option>
            <option value="cook">Cook / कुक</option>
            <option value="storekeeper">Store Keeper / स्टोर कीपर</option>
            <option value="procurement">Procurement / प्रोक्योरमेंट</option>
            <option value="distribution">Distribution / वितरण</option>
          </select>
        </div>
      </div>
      <p class="hint">${currentLang==='hi'
        ? 'ऊपर एक Role चुनें तो नीचे उसके डिफ़ॉल्ट अधिकार अपने-आप भर जाएंगे — फिर आप अपनी मर्ज़ी से किसी भी बॉक्स को टिक/अनटिक कर सकते हैं। यही अंतिम (custom) अधिकार यूज़र को मिलेंगे।'
        : 'Pick a Role above to auto-fill its defaults below — then tick/untick any box as you like. Whatever you save here becomes the final (custom) permissions for this user.'}</p>
      <div class="section-title" style="font-size:14px">${t("permissionsMatrix")}</div>
      <div id="newUserPermMatrix" style="overflow-x:auto">${permMatrixHtml("newp", DEFAULT_ROLE_PERMISSIONS.cook)}</div>
      <button class="btn-primary" style="width:auto;margin-top:10px" onclick="createNewUser()">${t("createUser")}</button>
    </div>
    <div class="card">
      <table><tr><th>${t("name")}</th><th>${t("email")}</th><th>${t("role")}</th><th>${t("action")}</th></tr>
      ${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td>
        <td><button class="small-btn" onclick="openEditPermissions('${u.id}')">${t("editPermissions")}</button></td></tr>
        <tr id="editRow_${u.id}" class="hidden"><td colspan="4">
          <div class="card" style="margin:8px 0">
            <div style="overflow-x:auto">${permMatrixHtml("editp_"+u.id, resolvePermissions(u))}</div>
            <button class="btn-primary" style="width:auto;margin-top:10px" onclick="saveUserPermissions('${u.id}')">${t("save")}</button>
            <button class="btn-secondary" onclick="document.getElementById('editRow_${u.id}').classList.add('hidden')">${t("cancel")}</button>
          </div>
        </td></tr>`).join("")}
      </table>
    </div>`;
}
window.prefillNewUserPerms = function(){
  const role = document.getElementById("newUserRole").value;
  const defaults = DEFAULT_ROLE_PERMISSIONS[role] || {};
  MODULES.forEach(m=>{
    ACTIONS.forEach(a=>{
      const el = document.getElementById(`newp_${m}_${a}`);
      if (el) el.checked = !!(defaults[m] && defaults[m][a]);
    });
  });
};
window.openEditPermissions = function(uid){
  document.getElementById(`editRow_${uid}`).classList.remove("hidden");
};
window.saveUserPermissions = async function(uid){
  const permissions = readPermMatrix("editp_"+uid);
  await updateOne("users", uid, { permissions });
  showToast(t("saved"),"success");
  renderUsers();
};
window.createNewUser = async function(){
  const name = document.getElementById("newUserName").value.trim();
  const email = document.getElementById("newUserEmail").value.trim();
  const password = document.getElementById("newUserPassword").value;
  const role = document.getElementById("newUserRole").value;
  const permissions = readPermMatrix("newp");
  if (!name||!email||password.length<6){ showToast("Sahi jaankari bharen (password >=6 chars)","error"); return; }
  try{
    // secondary app instance so creating a user doesn't log out the Admin
    const secondaryApp = initializeApp(firebaseApp.options, "Secondary_"+Date.now());
    const secondaryAuth = getAuth(secondaryApp);
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    await setDoc(doc(db, "users", cred.user.uid), { name, email, role, permissions });
    await signOut(secondaryAuth);
    showToast(t("saved"),"success");
    renderUsers();
  }catch(err){
    console.error(err);
    showToast(err.message,"error");
  }
};

const NAV_ITEMS = [
  { key:"dashboard",  labelKey:"dashboard",  render:renderDashboard },
  { key:"menu",       labelKey:"menu",       render:renderMenu },
  { key:"indent",     labelKey:"indent",     render:renderIndent },
  { key:"approval",   labelKey:"approval",   render:renderApproval },
  { key:"storeIssue", labelKey:"storeIssue", render:renderStoreIssue },
  { key:"receiving",  labelKey:"receiving",  render:renderReceiving },
  { key:"procurement",labelKey:"procurement",render:renderProcurement },
  { key:"distribution",labelKey:"distribution",render:renderDistribution },
  { key:"ingredients",labelKey:"ingredients",render:renderIngredients },
  { key:"suppliers",  labelKey:"suppliers",  render:renderSuppliers },
  { key:"reports",    labelKey:"reports",    render:renderReports },
  { key:"perPersonExp",labelKey:"perPersonExp",render:renderPerPersonExpenditure },
  { key:"users",      labelKey:"users",      render:renderUsers },
];

let activeModule = "dashboard";

function visibleItems(){
  const user = window.currentUserDoc;
  return NAV_ITEMS.filter(item => can(user, item.key, "view"));
}

function buildSidebar(){
  const items = visibleItems();
  const list = document.getElementById("navList");
  list.innerHTML = items.map(it =>
    `<li data-key="${it.key}" class="${it.key===activeModule?'active':''}" onclick="window.__navigateTo('${it.key}')">${t(it.labelKey)}</li>`
  ).join("");
  if (!items.find(i=>i.key===activeModule) && items.length){
    activeModule = items[0].key;
  }
}

window.__navigateTo = function(key){
  const item = NAV_ITEMS.find(i=>i.key===key);
  if (!item) return;
  if (!can(window.currentUserDoc, key, "view")){
    document.getElementById("mainContent").innerHTML = `<p>${t("accessDenied")}</p>`;
    return;
  }
  activeModule = key;
  buildSidebar();
  item.render();
  document.getElementById("sidebar").classList.remove("open"); // close on mobile after nav
};

window.renderCurrentModule = function(){
  applyStaticTranslations();
  buildSidebar();
  const item = NAV_ITEMS.find(i=>i.key===activeModule);
  if (item) item.render();
};

window.toggleSidebar = function(){
  document.getElementById("sidebar").classList.toggle("open");
};

// Called by auth.js right after successful login
window.initAppUI = function(){
  activeModule = "dashboard";
  window.renderCurrentModule();
};
</script>
