@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--ink:#e9efe9;--mut:#93a39a;--pri:#4fc39b;--acc:#e0b35a;--bad:#ff8a80;--good:#7bd39a;--line:#2f3b35}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--ink:#e9efe9;--mut:#93a39a;--pri:#4fc39b;--acc:#e0b35a;--bad:#ff8a80;--good:#7bd39a;--line:#2f3b35}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans Devanagari","Segoe UI",Arial,sans-serif}
header{background:var(--pri);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:3}
header b{font-size:17px}header small{opacity:.85;display:block}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:2}
nav button{flex:none;border:0;background:none;color:var(--mut);padding:12px 14px;font:inherit;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--pri);border-color:var(--acc);font-weight:700}
main{padding:14px;max-width:1050px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{border-left:4px solid var(--acc);padding:6px 10px}.k span{color:var(--mut);font-size:12px}.k div{font-size:22px;font-weight:700}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600}
button.b,input,select{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.b{background:var(--pri);color:#fff;border:0;cursor:pointer;margin:2px}button.b.s{background:var(--acc);color:#1f2a24}button.b.x{background:var(--bad)}
.r{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tag{padding:2px 8px;border-radius:99px;background:var(--line);font-size:12px}.bad{color:var(--bad);font-weight:600}.good{color:var(--good);font-weight:600}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
#login{max-width:340px;margin:8vh auto;padding:14px}#login input{width:100%;margin-bottom:8px}
p.hint{color:var(--mut);font-size:13px;margin:4px 0 0}
.chk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer}
.chk input{padding:0}
.sub{color:var(--mut);font-size:12px}
</style></head><body>

function dayCost(d){return S.indents.filter(x=>x.issued==d).reduce((a,x)=>a+x.val,0)}

/* procurement */
function newPO(i){const q=parseFloat(prompt('मात्रा ('+I(i).u+') – '+nm(I(i)),Math.max(I(i).min*2-I(i).hand,1)));if(!(q>0))return;const r=parseFloat(prompt('दर',I(i).rate))||I(i).rate;const v=prompt('विक्रेता (Vendor)','स्थानीय मंडी')||'-';
S.pos.push({id:S.pos.length+1,v,i,q,r,st:'Approved',date:D});I(i).pipe+=q;save();render()}
function recv(id){const p=S.pos.find(x=>x.id==id);const q=parseFloat(prompt('प्राप्त मात्रा (बाकी '+p.q+')',p.q));if(!(q>0))return;const it=I(p.i),rq=Math.min(q,p.q);
it.rate=(it.hand*it.rate+rq*p.r)/(it.hand+rq);it.hand+=rq;it.pipe-=rq;p.q-=rq;if(p.q<=0)p.st='Received';else p.st='Partial';save();render()}

/* stock excel */
function dlTemplate(){
 const rows=[['Item Name (Hindi)','Item Name (English)','Category','Unit','Rate','Min Stock','Current Stock (Hand)','Veg/Non-Veg']];
 S.items.forEach(i=>rows.push([i.n,i.en||'',i.c||'',i.u,i.rate,i.min,i.hand,i.veg===false?'Non-Veg':'Veg']));
 const ws=XLSX.utils.aoa_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Stock');
 XLSX.writeFile(wb,'FMB_Stock_Template.xlsx');
}
function upXlsx(inp){
 const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=e=>{try{
  const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  let added=0,updated=0;
  rows.forEach(r=>{
   const n=(r['Item Name (Hindi)']||r['Item Name']||r['Item']||'').toString().trim();
   const en=(r['Item Name (English)']||r['English Name']||'').toString().trim();
   if(!n&&!en)return;
   const c=(r['Category']||'').toString().trim();
   const u=(r['Unit']||'kg').toString().trim();
   const rate=parseFloat(r['Rate'])||0;
   const min=parseFloat(r['Min Stock'])||0;
   const hraw=r['Current Stock (Hand)']!==undefined&&r['Current Stock (Hand)']!==''?r['Current Stock (Hand)']:r['Current Stock'];
   const hand=parseFloat(hraw)||0;
   const veg=!/non/i.test((r['Veg/Non-Veg']||'Veg').toString());
   let it=S.items.find(x=>(n&&x.n.toLowerCase()==n.toLowerCase())||(en&&x.en&&x.en.toLowerCase()==en.toLowerCase()));
   if(it){it.u=u;it.rate=rate;it.min=min;it.hand=hand;it.veg=veg;if(c)it.c=c;if(en)it.en=en;updated++}
   else{const nid=S.items.reduce((m,i)=>Math.max(m,i.id),-1)+1;S.items.push({id:nid,n:n||en,en,c,u,rate,min,hand,pipe:0,veg});added++}
  });
  save();render();alert('अपलोड पूर्ण — नए: '+added+', अपडेट हुए: '+updated);
 }catch(err){alert('फ़ाइल पढ़ने में त्रुटि: '+err.message)}};
 rd.readAsArrayBuffer(f);
 inp.value='';
}
